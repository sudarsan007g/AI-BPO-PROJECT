<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Support Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="phone-shell">
    <div class="top-bar">
      <span class="dot"></span>
      <span class="brand">AI SUPPORT LINE</span>
    </div>

    <div class="status-area">
      <h1 id="statusTitle">Tap to call</h1>
      <p id="statusSub">Your AI agent, Priya, is ready to help</p>
    </div>

    <div class="call-button-wrap">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <button id="callBtn" class="call-btn">
        <svg id="phoneIcon" viewBox="0 0 24 24" width="34" height="34">
          <path fill="currentColor" d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.4.6 3.6.6.6 0 1 .5 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.2c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1.1L6.6 10.8z"/>
        </svg>
      </button>
    </div>

    <div id="transcript" class="transcript"></div>

    <div class="actions">
      <button id="downloadBtn" class="link-btn" style="display:none;">⬇ Download call log (Excel)</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
